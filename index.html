<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Tower Defense</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            background: #3a7d3a;
            border: 5px solid #000;
        }
    </style>
</head>
<body>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Bane (sti)
const path = [
    {x: 0, y: 250},
    {x: 200, y: 250},
    {x: 200, y: 100},
    {x: 500, y: 100},
    {x: 500, y: 400},
    {x: 800, y: 400}
];

// Fiender
let enemies = [];
let enemySpeed = 1;

// Tårn
let towers = [
    {x: 300, y: 200, range: 120},
    {x: 600, y: 250, range: 120}
];

// Kuler
let bullets = [];

// Spawn fiender
setInterval(() => {
    enemies.push({
        x: path[0].x,
        y: path[0].y,
        hp: 3,
        pathIndex: 0
    });
}, 1500);

// Tegn sti
function drawPath() {
    ctx.strokeStyle = "#c2b280";
    ctx.lineWidth = 40;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let p of path) ctx.lineTo(p.x, p.y);
    ctx.stroke();
}

// Oppdater fiender
function updateEnemies() {
    enemies.forEach(enemy => {
        let target = path[enemy.pathIndex + 1];
        if (!target) return;

        let dx = target.x - enemy.x;
        let dy = target.y - enemy.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 2) {
            enemy.pathIndex++;
        } else {
            enemy.x += (dx / dist) * enemySpeed;
            enemy.y += (dy / dist) * enemySpeed;
        }
    });

    enemies = enemies.filter(e => e.pathIndex < path.length - 1 && e.hp > 0);
}

// Tegn fiender
function drawEnemies() {
    enemies.forEach(e => {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Tegn tårn
function drawTowers() {
    towers.forEach(t => {
        ctx.fillStyle = "blue";
        ctx.beginPath();
        ctx.arc(t.x, t.y, 20, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Tårn skyter
function towerShoot() {
    towers.forEach(t => {
        enemies.forEach(e => {
            let dx = e.x - t.x;
            let dy = e.y - t.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < t.range) {
                bullets.push({
                    x: t.x,
                    y: t.y,
                    target: e
                });
            }
        });
    });
}

// Oppdater kuler
function updateBullets() {
    bullets.forEach(b => {
        let dx = b.target.x - b.x;
        let dy = b.target.y - b.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 5) {
            b.target.hp--;
            b.hit = true;
        } else {
            b.x += dx / dist * 5;
            b.y += dy / dist * 5;
        }
    });

    bullets = bullets.filter(b => !b.hit);
}

// Tegn kuler
function drawBullets() {
    bullets.forEach(b => {
        ctx.fillStyle = "yellow";
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Spill-loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawPath();
    updateEnemies();
    drawEnemies();

    drawTowers();
    towerShoot();

    updateBullets();
    drawBullets();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Tower Defense</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }

        canvas {
            background: #3a7d3a;
            border: 5px solid #000;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
        }

        #buyBtn {
            padding: 10px 20px;
            background: #444;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            margin-top: 10px;
        }

        #buyBtn:hover {
            background: #666;
        }
    </style>
</head>
<body>

<div id="ui">
    Penger: <span id="money">100</span><br>
    <button id="buyBtn">Kjøp tårn (50)</button>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const moneyDisplay = document.getElementById("money");
const buyBtn = document.getElementById("buyBtn");

let money = 100;
let buyingTower = false;

// Sti
const path = [
    {x: 0, y: 250},
    {x: 200, y: 250},
    {x: 200, y: 100},
    {x: 500, y: 100},
    {x: 500, y: 400},
    {x: 800, y: 400}
];

// Fiender
let enemies = [];
let enemySpeed = 1;

// Tårn
let towers = [];

// Kuler
let bullets = [];

// Spawn fiender
setInterval(() => {
    enemies.push({
        x: path[0].x,
        y: path[0].y,
        hp: 3,
        pathIndex: 0
    });
}, 1500);

// Kjøp tårn
buyBtn.onclick = () => {
    if (money >= 50) {
        buyingTower = true;
    }
};

// Plasser tårn
canvas.addEventListener("click", (e) => {
    if (!buyingTower) return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    towers.push({
        x,
        y,
        range: 120
    });

    money -= 50;
    moneyDisplay.textContent = money;
    buyingTower = false;
});

// Tegn sti
function drawPath() {
    ctx.strokeStyle = "#c2b280";
    ctx.lineWidth = 40;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let p of path) ctx.lineTo(p.x, p.y);
    ctx.stroke();
}

// Oppdater fiender
function updateEnemies() {
    enemies.forEach(enemy => {
        let target = path[enemy.pathIndex + 1];
        if (!target) return;

        let dx = target.x - enemy.x;
        let dy = target.y - enemy.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 2) {
            enemy.pathIndex++;
        } else {
            enemy.x += (dx / dist) * enemySpeed;
            enemy.y += (dy / dist) * enemySpeed;
        }
    });

    // Gi penger for kills
    enemies.forEach(e => {
        if (e.hp <= 0) {
            money += 10;
            moneyDisplay.textContent = money;
        }
    });

    enemies = enemies.filter(e => e.pathIndex < path.length - 1 && e.hp > 0);
}

// Tegn fiender
function drawEnemies() {
    enemies.forEach(e => {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Tegn tårn
function drawTowers() {
    towers.forEach(t => {
        ctx.fillStyle = "blue";
        ctx.beginPath();
        ctx.arc(t.x, t.y, 20, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Tårn skyter
function towerShoot() {
    towers.forEach(t => {
        enemies.forEach(e => {
            let dx = e.x - t.x;
            let dy = e.y - t.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < t.range) {
                bullets.push({
                    x: t.x,
                    y: t.y,
                    target: e
                });
            }
        });
    });
}

// Oppdater kuler
function updateBullets() {
    bullets.forEach(b => {
        let dx = b.target.x - b.x;
        let dy = b.target.y - b.y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 5) {
            b.target.hp--;
            b.hit = true;
        } else {
            b.x += dx / dist * 5;
            b.y += dy / dist * 5;
        }
    });

    bullets = bullets.filter(b => !b.hit);
}

// Tegn kuler
function drawBullets() {
    bullets.forEach(b => {
        ctx.fillStyle = "yellow";
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
    });
}

// Spill-loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawPath();
    updateEnemies();
    drawEnemies();

    drawTowers();
    towerShoot();

    updateBullets();
    drawBullets();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
